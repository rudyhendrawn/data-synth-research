name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check configuration and Python syntax
        run: |
          python -m json.tool configs/revision_experiments.json > /dev/null
          python -m compileall -q benchmark evaluation loader model preprocessor scripts
      - name: Run focused validation
        run: python -m unittest discover -s tests -v
